<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Game lab</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--acc:#6c8cff;--red:#ff5d6c;--grn:#3ecf8e;--panel:#17151a;--text:#f1eef3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:12px 12px 40px;max-width:560px;margin:0 auto}
  h1{font-size:19px;margin:6px 0 2px}
  .mut{color:var(--mut);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button,select,input{font:inherit;color:inherit;background:#20242e;border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:48px}
  button{cursor:pointer}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.red{background:transparent;border-color:var(--red);color:var(--red)}
  input[type=password]{flex:1;min-width:150px}
  .sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:12px 0}
  .sl label{font-weight:600}.sl output{color:var(--acc);font-variant-numeric:tabular-nums}
  .sl input[type=range]{grid-column:1/3;width:100%;min-height:36px;padding:0;accent-color:var(--acc)}
  .sl small{grid-column:1/3;color:var(--mut);font-size:12px}
  #log{font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
  .ok{color:var(--grn)}.bad{color:var(--red)}
  #msg{min-height:20px;margin:6px 0}
</style>
</head>
<body>
<h1>Game lab</h1>
<div class="mut">Yahan khud khelke dekho ki gend ki speed, size aur raasta kaisa lag raha hai. Number theek lage to <b>Live karo</b> dabao: tab ye asli captcha me lagega (DB me save hota hai). Lab me khelne par rate limit nahi lagta.</div>

<div class="card" id="login">
  <div class="row"><input type="password" id="key" placeholder="Admin key" autocomplete="current-password"><button class="pri" id="go">Open</button></div>
  <div id="lmsg" class="mut" style="margin-top:6px"></div>
</div>

<div id="lab" hidden>
  <div id="host" class="capcard inl"></div>
  <div id="msg" class="mut"></div>
  <div class="row">
    <button class="pri" id="newg">New game</button>
    <button id="live">Live karo</button>
    <button class="red" id="reset">Default</button>
  </div>

  <div class="card">
    <div class="sl"><label for="type">Raasta (game type)</label><output id="o_type"></output>
      <select id="type" style="grid-column:1/3;width:100%"><option value="">Auto (jo live hai)</option><option value="0">0 zigzag</option><option value="1">1 orbit</option><option value="2">2 lissajous</option><option value="3">3 eight (8)</option></select></div>
    <div id="sliders"></div>
  </div>

  <div class="card">
    <div class="mut">Server ka faisla (har khel ke baad)</div>
    <div id="log"></div>
  </div>
  <div class="card"><div class="mut" id="stats">-</div></div>
</div>

<script src="/captcha.js?v=9"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const SL = [   /* key, name, min, max, step, help (limits = the server's own limits) */
  ["speed", "Gend ki speed", 0.3, 3, 0.05, "1.0 = normal. Zyada = tez ghoomti hain."],
  ["size", "Gend ka size (radius)", 8, 30, 1, "Bada = aasaan. Phone pe angutha mota hai, 16 se neeche mat jao."],
  ["balls", "Kitni gend", 2, 4, 1, "4 pe har rang hamesha screen pe rehta hai."],
  ["color_ms", "Rang badalne ki raftaar (ms)", 600, 8000, 100, "Chhota = rang jaldi badalta hai."],
  ["skew", "Shot ka tedhapan (radian)", 0, 0.3, 0.01, "Aim line me ye jud ke dikhta hai. 0.10 = thoda tedha."],
  ["bullet", "Goli ki speed (px/sec)", 250, 1200, 10, "Chhoti = door ki gend pe goli der se pahunchti hai."],
  ["min_shot_ms", "Do shot ke beech kam se kam (ms)", 100, 1500, 50, "Plan: 400 (0.4 sec)."],
  ["hits", "Kitne sahi shot chahiye", 1, 4, 1, "Plan: 2."],
  ["max_shots", "Kul shot milenge", 1, 10, 1, "Itne me sahi na lage to naya khel."],
  ["slack", "Hit ka extra pass (px)", 0, 10, 0.5, "Pixel-close shot na chhute. 3 theek hai."]
];
let KEY = ""; try { KEY = sessionStorage.getItem("ak") || ""; } catch (e) {}
let DEF = null, cur = {}, ctl = null, tmr = 0;
const DID = "lab" + Math.random().toString(36).slice(2, 12);

async function adm(body) {
  const r = await fetch("/api/admin/captcha", { method: "POST", headers: { "X-Admin-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j;
}
function build(cfg) {
  const box = $("sliders"); box.replaceChildren();
  for (const [k, name, lo, hi, st, help] of SL) {
    const w = document.createElement("div"); w.className = "sl";
    w.innerHTML = `<label for="s_${k}">${name}</label><output id="v_${k}"></output><input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${st}"><small>${help}</small>`;
    box.append(w);
    const el = w.querySelector("input"); el.value = cfg[k]; cur[k] = +cfg[k]; $("v_" + k).textContent = cfg[k];
    el.oninput = () => { cur[k] = +el.value; $("v_" + k).textContent = el.value; clearTimeout(tmr); tmr = setTimeout(newGame, 500); };
  }
}
function line(t, cls) { const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = t; $("log").prepend(d); }
function newGame() {
  clearTimeout(tmr); if (ctl) ctl.stop(); $("msg").textContent = "";
  ctl = CapGame.run($("host"), {
    lab: true, type: $("type").value, cfg: Object.assign({}, cur),
    headers: { "X-Admin-Key": KEY, "X-Device": DID },
    onStart: g => line("--- naya khel: " + g.game.name + " | " + g.game.balls.length + " gend | targets " + g.game.targets.slice(0, g.cfg.hits).map(x => CapGame.COLS[x].n).join(",") + "...", "mut"),
    onShot: s => line("shot " + (s.k + 1) + ": t=" + s.t + "ms angle=" + s.a.toFixed(3) + " (tedha " + s.skew.toFixed(2) + ") -> " + (s.hit < 0 ? "koi gend nahi" : (CapGame.COLS[s.color].n + " gend, chahiye " + CapGame.COLS[s.want].n)) + (s.ok ? "  SAHI" : "  galat"), s.ok ? "ok" : "bad"),
    onVerified: (r) => {
      line("SERVER: " + (r.ok ? "PASS" : "FAIL (" + (r.real_why || r.why) + ")") + " | sahi " + (r.hits ?? "?") + "/" + (r.need ?? "?") + " | insaan score " + (r.human ?? "?") + "/100 (60+ = bot)" + ((r.human_why || []).length ? " | " + r.human_why.join("; ") : ""), r.ok ? "ok" : "bad");
      refreshStats();
    },
    onPass: () => { $("msg").textContent = "Pass! 'New game' dabao dobara khelne ke liye."; },
    onClose: () => { $("msg").textContent = ""; }
  });
}
async function refreshStats() {
  try { const j = await adm({ action: "stats" }), c = j.counts || {};
    $("stats").textContent = "Live types: " + (j.types || []).join(", ") + " | naye " + (c.new || 0) + ", pass " + (c.pass || 0) + ", fail " + (c.fail || 0) + " | pow bits " + j.pow_bits + ", pass token " + j.pass_min + " min";
  } catch (e) {}
}
async function open_() {
  try {
    const j = await adm({ action: "stats" }); DEF = j.cfg;
    $("login").hidden = true; $("lab").hidden = false; try { sessionStorage.setItem("ak", KEY); } catch (e) {}
    build(DEF); refreshStats(); newGame();
  } catch (e) { $("login").hidden = false; $("lab").hidden = true; $("lmsg").textContent = "Key galat ya server band: " + e.message; }
}
$("go").onclick = () => { KEY = $("key").value.trim(); open_(); };
$("key").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("newg").onclick = newGame;
$("type").onchange = newGame;
$("live").onclick = async () => {
  if (!confirm("Ye numbers asli captcha me lag jayenge. Pakka?")) return;
  try { await adm({ action: "cfg", cfg: cur }); $("msg").textContent = "Live ho gaya (DB me save)."; refreshStats(); } catch (e) { $("msg").textContent = "Save nahi hua: " + e.message; }
};
$("reset").onclick = async () => {
  if (!confirm("Sab number default pe lautane hain? (live bhi)")) return;
  try { const j = await adm({ action: "cfg", reset: true }); build(j.cfg); newGame(); $("msg").textContent = "Default pe aa gaya."; } catch (e) { $("msg").textContent = e.message; }
};
if (KEY) open_();
</script>
</body>
</html>
